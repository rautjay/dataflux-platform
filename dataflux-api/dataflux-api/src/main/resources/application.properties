spring.application.name=dataflux-api

spring.datasource.url=jdbc:postgresql://172.19.34.10:5432/dataflux
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

dataflux.file.upload-dir=C:/jay Saas/dataflux-platform/uploads
dataflux.file.tmp-dir=C:/jay Saas/dataflux-platform/tmp
dataflux.file.max-size=10485760


# Multipart config (supports large files)
spring.servlet.multipart.max-file-size=10GB
spring.servlet.multipart.max-request-size=10GB


#processing defaults for request.
dataflux.processing.skip-header=true
dataflux.processing.delimiter=,
dataflux.processing.fail-fast=false
dataflux.processing.priority=NORMAL


# ── Async Executor ────────────────────────────────────────────────────────────
dataflux.async.core-pool-size=5
dataflux.async.max-pool-size=20
dataflux.async.queue-capacity=50



# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.dataflux=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n



# ── Redis Configuration ─────────────────────────────────────────────────────────
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=root
spring.redis.database=0 
